version: '3.8'

services:
  # Baza podataka
  db:
    image: postgres
    container_name: pozoriste_db
    restart: always
    environment:
      MYSQL_DATABASE: prodaja_ulaznica
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Laravel Backend (PHP-FPM)
  app:
    build:
      context: .  # Glavni folder
      dockerfile: ./docker/laravel/Dockerfile
    container_name: pozoriste_backend
    working_dir: /var/www
    volumes:
      - ./pozoristeback:/var/www
    depends_on:
      - db

  # Nginx
  nginx:
    image: nginx:stable-alpine
    container_name: pozoriste_nginx
    ports:
      - "8000:80"
    volumes:
      - ./pozoristeback:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # React Frontend 
  front:
    image: node:20-alpine
    container_name: pozoriste_frontend
    working_dir: /app
    volumes:
      - ./pozoristefront:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && CHOKIDAR_USEPOLLING=true npm start"

volumes:
  db_data: