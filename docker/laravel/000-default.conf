<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    # DODAJEMO /pozoristeback/ U PUTANJU
    DocumentRoot /var/www/pozoristeback/public

    <Directory /var/www/pozoristeback/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>