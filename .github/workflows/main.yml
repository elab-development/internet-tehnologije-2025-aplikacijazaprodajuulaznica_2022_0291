name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prodaja_ulaznica
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, curl, libxml, mysql, pdo_mysql
        coverage: none

    - name: Install Dependencies
      run: |
        cd pozoristeback
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Execute tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: prodaja_ulaznica
        DB_USERNAME: root
        DB_PASSWORD: root
        APP_KEY: base64:uPUnebC5Dl5YZufrVkzGZqi+SEZJ9ygnx2WQthAbFJg=
      run: |
        cd pozoristeback
        php artisan migrate:fresh --seed
        php artisan test

  build-docker-image:
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run:
        docker build -t pozoriste-app:latest -f ./docker/laravel/Dockerfile .
        echo "Build uspešan!"