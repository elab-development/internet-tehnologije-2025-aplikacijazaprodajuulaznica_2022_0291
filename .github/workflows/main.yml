name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prodaja_ulaznica
        ports:
          - 3307:3306  # Spoljašnji port 3307 se mapira na unutrašnji 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, curl, libxml, mysql, pdo_mysql
        coverage: none

    - name: Copy .env
      run: |
        cd pozoristeback
        cp .env.example .env || true

    - name: Install Dependencies
      run: |
        cd pozoristeback
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: |
        cd pozoristeback
        php artisan key:generate

    - name: Wait for MySQL
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client
        echo "Čekam MySQL na portu 3307..."
        while ! mysqladmin ping -h 127.0.0.1 -P 3307 -u root -proot --silent; do
          echo "MySQL još nije spreman..."
          sleep 2
        done
        echo "MySQL je spreman!"

    - name: Run migrations
      run: |
        cd pozoristeback
        php artisan migrate --force || echo "Migracije nisu potrebne ili su već pokrenute"

    - name: Execute tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3307  # <<<<< PORT 3307 kao u VS Code-u!
        DB_DATABASE: prodaja_ulaznica
        DB_USERNAME: root
        DB_PASSWORD: root
        APP_KEY: base64:uPUnebC5Dl5YZufrVkzGZqi+SEZJ9ygnx2WQthAbFJg=
      run: |
        cd pozoristeback
        echo "Pokrećem testove sa portom 3307..."
        php artisan test

  build-docker-image:
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        echo "Build-ujem Docker image..."
        docker build -t pozoriste-app:latest -f ./docker/laravel/Dockerfile .
        echo "Build uspešan!"